{% if img %}
<div class="travel_info_item_with_image">

<div class="image">
{% if link %}
<a href="{{ link | safe }}"><img src="{{ img | safe }}" {% if alt %}alt="{{ alt }}"{% endif %}></a>
{% else %}
<a href="{{ img | safe }}"><img src="{{ img | safe }}"></a>
{% endif %}
</div>
<div class="body">
  {{ body | safe }}
</div>

</div>


{% else %}

<div class="travel_info_item">
<div class="body">
{{ body | safe }}
</div>
</div>

{% endif %}
